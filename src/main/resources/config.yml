config-version: 3

models:
  default: ysm_01_jk_player
  allowed: [ysm_01_jk_player, ysm_01_jk_npc]

disguise:
  scale: 1.0
  hide-self: true
  # 默认向本人渲染模型；false 避免第一人称遮挡，也会隐藏本人第三人称的模型。
  show-self: true
  # 其他玩家与真实玩家脚底的三维距离必须严格小于此值，范围 0.1–256 格。
  view-distance: 8.0
  # 最近的其他观众名额，不包含本人；范围 0–1000，0 表示其他人均不可见。
  max-viewers: 10
  # 原生 /meg disguise 的模型须为 state_machine；新 /meplayeractions disguise 自动指定。
  adopt-original: true

controller:
  # 1 tick = 50 ms（20 TPS）。采样间隔越大，姿态识别延迟越高。
  sample-interval-ticks: 1
  # 控制动画层切换检查；ME 仍每 tick 推进动画，不会按此间隔重启动画。
  animation-update-interval-ticks: 1
  # 入场/退场混合插值；0 表示瞬间切换。可在 animation-settings 覆盖单个状态。
  transition-in-ticks: 2
  transition-out-ticks: 2
  posture-priority: 100
  interaction-priority: 150
  manual-priority: 200
  movement-threshold: 0.015
  # 原生手臂摆动是短暂事件；连续摆动会续期，但不会每次重播同一动画。
  swing-duration-ticks: 8
  # 挖掘摆臂续期，松手/方块破坏/换目标/换工具会结束；超时防止残留。
  mining-timeout-ticks: 12

# 仅延迟模型的显示位置和对应姿态，真实玩家坐标/碰撞照常。
# 0 = 紧跟；2 = 约 100 ms 拖后；建议 1–4。不会复制多个模型残影。
visual-follow:
  delay-ticks: 2
  max-distance-blocks: 2.0
  # 进入/离开坐姿、趴姿、睡眠、游泳、载具和飞行立即对齐。
  snap-on-posture-change: true

jump:
  # 0 = 按当前跳跃动画长度、速度及入场时间计算。防止一落地就切掉动画。
  minimum-play-ticks: 0
  # 落地后最多保留这么多 tick；遇其他姿态、传送、重置立即结束。
  landing-grace-ticks: 6

# 以下仅控制本插件的动画层。关闭坐姿同步不妨碍 GSit 真实坐下。
# ME 自身的基础自动动作仍由 ME 管理。
synchronization:
  enabled: true
  movement: true
  sprint: true
  jump: true
  sit: true
  sleep: true
  ride: true
  crawl: true
  sneak: true
  swim: true
  flight: true
  elytra: true
  swing: true
  mining: true

manual:
  allow-raw-animation: true
  cooldown-ticks: 4
  max-duration-ticks: 600
  min-speed: 0.1
  max-speed: 5.0
  interrupt-on-movement: true
  interrupt-on-damage: true
  interrupt-on-posture: true

gameplay:
  # 真实生存飞行须同时开启此项并授予 mact.flight；创造飞行的动作照常同步。
  allow-flight-command: false
  flight-speed: 0.1

animations:
  defaults:
    idle: [idle]
    walk: [walk]
    run: [run, walk]
    jump: [player_jump, jump]
    fall: [fall, jump, idle]
    sit: [sit]
    # GSit 躺下接触地面；原生床使用独立状态及床顶锚点/朝向。
    sleep: [bed_sleep, sleep, lay]
    bed-sleep: [bed_sleep, sleep, lay]
    boat: [sit_boat, boat, sit]
    minecart: [sit_minecart, minecart, sit]
    ride: [ride, sit]
    crawl-idle: [crawl_idle, crawl_walk]
    crawl-walk: [crawl_walk, crawl_idle]
    crouch-idle: [crouch_idle]
    crouch-walk: [crouch_walk, crouch_idle]
    swim-idle: [swim_idle, swim]
    # 漂浮直立与水平游泳停住是两种姿态；后者不能回退到直立 swim_idle。
    swim-prone-idle: [swim_prone_idle, swim]
    swim-walk: [swim, swim_idle]
    hover: [hover, fly]
    fly: [fly, hover]
    elytra: [elytra_fly, fly]
    # 原生左键摆臂与 /meplayeractions play wave（主动挥手）独立；此层只映射模型已有动画。
    swing-mainhand: [attack, swing, use_mainhand]
    swing-offhand: [attack_offhand, use_offhand]
    mining: [mining, dig, attack, use_mainhand]
  models:
    ysm_01_jk_npc:
      # 0.2.1 安装包为 NPC 模型新增真正的卧倒轨道，保留原有直立 climb 动作。
      # 更新时须同时安装包内两个 bbmodel，再 /meg reload models。
      crawl-idle: [crawl_idle, crawl_walk]
      crawl-walk: [crawl_walk, crawl_idle]

# 按状态设置速度、ONCE/LOOP/HOLD、入场和退场混合 tick。
# 未配置状态继承 controller 的过渡时间，速度为 1。
# 坐姿/睡眠/陆地趴姿默认 HOLD；运动和挖掘 LOOP；跳跃、挥臂 ONCE。
animation-settings:
  jump:
    loop: ONCE
    transition-in-ticks: 1
    transition-out-ticks: 2
  fall:
    loop: HOLD
  sleep:
    loop: HOLD
    speed: 1.0
  bed-sleep:
    loop: HOLD
    speed: 1.0
  mining:
    loop: LOOP
    speed: 1.0
    transition-in-ticks: 1
    transition-out-ticks: 1
  swing-mainhand:
    loop: ONCE
    transition-in-ticks: 1
    transition-out-ticks: 1
  swing-offhand:
    loop: ONCE
    transition-in-ticks: 1
    transition-out-ticks: 1

# /meplayeractions play wave。可新增动作名映射到任意已存在的动画。
custom-actions:
  wave:
    enabled: true
    label: 挥手
    animation: wave
    loop: ONCE
    speed: 1.0
    permission: mact.use
  nod:
    label: 点头
    animation: nod
    loop: ONCE
    speed: 1.0
  talk:
    label: 说话
    animation: talk
    loop: ONCE
    speed: 1.0
  smile:
    label: 微笑
    animation: smile
    loop: ONCE
    speed: 1.0
  surprised:
    label: 惊讶
    animation: surprised
    loop: ONCE
    speed: 1.0

# 原始动画的菜单中文名称；旧配置未写时仍使用内置汉化。
# custom-actions.<动作>.label 优先于这里的名称，可为自定义动画增加条目。
menu:
  animation-labels:
    idle: 站立待机
    walk: 行走
    run: 奔跑
    death: 死亡
    jump: 跳跃
    player_jump: 完整跳跃
    fly: 飞行
    hover: 悬停
    hurt: 受伤
    crouch_idle: 潜行待机
    crouch_walk: 潜行移动
    swim: 游泳
    swim_idle: 踩水待机
    sit: 坐下
    sleep: 卷曲睡眠
    bed_sleep: 横卧睡眠
    climb: 攀爬动作
    climb_idle: 攀爬待机
    crawl_idle: 趴下待机
    crawl_walk: 爬行移动
    use_mainhand: 使用主手
    use_offhand: 使用副手
    attack: 主手攻击／挥臂
    ribbon_sway: 飘带摆动
    tail_hair_sway: 尾巴与发丝摆动
    blink: 眨眼
    wave: 挥手
    nod: 点头
    talk: 说话
    smile: 微笑
    surprised: 惊讶

client-sync:
  # 客户端协议 v2。仅在模型/纹理加载成功且服务器确认 ready 后按观众切换本地渲染。
  # 未安装模组、资产失败、断开或 100 tick 无渲染续租时继续/恢复 ME。
  # 本地模型原始资源依次读取本插件 models/、ME blueprints/、插件内置示例。
  enabled: true
  max-payload-bytes: 16000
  request-cooldown-ticks: 4
  view-distance-blocks: 64
