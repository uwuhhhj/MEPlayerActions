config-version: 4

# 服务器伪装使用 ModelEngine 已注册的蓝图，模型名与 /meg disguise 一致。
# MEPlayerActions/models/ 只提供客户端下发资源；无需在本配置中重复登记模型。

disguise:
  scale: 1.0
  hide-self: true
  # 默认向本人渲染模型；客户端第一人称自动隐藏。false 也会隐藏本人第三人称的模型。
  show-self: true
  # 其他玩家与真实玩家脚底的三维距离必须严格小于此值，范围 0.1–256 格。
  view-distance: 8.0
  # 最近的其他观众名额，不包含本人；范围 0–1000，0 表示其他人均不可见。
  max-viewers: 10
  # 原生 /meg disguise 的模型须为 state_machine；新 /meplayeractions disguise 自动指定。
  adopt-original: true

# 后台发现与检查；不会改变模型动画、位置跟随或物理的逐 tick 更新。
# 旧配置缺少这些键时直接采用下列默认值，无需覆盖服务器现有配置。
performance:
  # 重选观众的周期，范围 20–100 tick（1–5 秒）；各模型/观看者分批刷新。
  audience-refresh-ticks: 40
  # 已建立关系的轻量资格检查，范围 1–20 tick；心跳仍独立每秒发送。
  validation-ticks: 20
  # 原生 /meg 伪装的自动接管轮次，范围 20–100 tick；MPA 指令仍立即接管。
  adoption-scan-ticks: 100

# 化妆资源可排队或拒绝，避免与正常游戏争抢资源。所有数值都有硬上限校验。
# 省略新键时使用以下默认值；升级时保留现有配置，按需添加此节。
resource-protection:
  enabled: true
  tasks:
    worker-threads: 2
    queue-capacity: 32
    jobs-per-player: 4
    max-reserved-bytes: 134217728
    per-player-reserved-bytes: 67108864
    pending-completions: 64
    max-pending-completion-bytes: 134217728
    callbacks-per-tick: 8
    queue-timeout-ticks: 600
    task-idle-ticks: 600
    task-timeout-ticks: 2400
  network:
    global-upload-bytes-per-second: 4194304
    global-download-bytes-per-second: 8388608
    upload-bytes-per-second: 262144
    download-bytes-per-second: 2097152
    asset-download-bytes-per-second: 524288
    global-packets-per-second: 4096
    packets-per-second: 48
    burst-bytes: 8388608
    bytes-per-tick: 524288
    asset-bytes-per-tick: 262144
    global-transfers: 32
    transfers-per-player: 2
    waiting-transfers: 128
    max-queued-outgoing-bytes: 16777216
    transfer-queue-ticks: 600
    transfer-idle-ticks: 300
    transfer-total-ticks: 2400
    ready-ticks: 300
  protection:
    throttled-tps: 18.0
    protected-tps: 15.0
    emergency-tps: 10.0
    throttled-mspt: 55.0
    protected-mspt: 75.0
    emergency-mspt: 150.0
    recovery-tps: 19.0
    recovery-mspt: 45.0
    recovery-ticks: 600
    main-budget-millis: 3.0
    main-work-per-tick: 64
  models:
    max-disguises: 256
    max-publications: 256
    max-relations: 4096
    max-models-per-viewer: 64
    new-disguises-per-second: 20
    disguise-cooldown-ticks: 20
    # EMERGENCY 每 tick 最多清理本插件创建的实例；0 表示不自动清理。
    emergency-removals-per-tick: 2
    max-asset-cache-bytes: 134217728
    max-asset-cache-models: 512
  disk:
    max-temporary-bytes: 268435456
    min-free-bytes: 536870912
  complexity:
    max-bones: 4096
    max-animations: 1024
    max-keyframes: 65536
    max-expressions: 32768
    max-expression-chars: 2097152
    max-json-nodes: 200000
    max-archive-entries: 256
    max-expanded-bytes: 8388608
    max-texture-pixels: 16777216

controller:
  # 1 tick = 50 ms（20 TPS）。采样间隔越大，姿态识别延迟越高。
  sample-interval-ticks: 1
  # 控制动画层切换检查；ME 仍每 tick 推进动画，不会按此间隔重启动画。
  animation-update-interval-ticks: 1
  # 入场/退场混合插值；0 表示瞬间切换。可在 animation-settings 覆盖单个状态。
  transition-in-ticks: 2
  transition-out-ticks: 2
  posture-priority: 100
  interaction-priority: 150
  manual-priority: 200
  movement-threshold: 0.015
  # 原生手臂摆动是短暂事件；连续摆动会续期，但不会每次重播同一动画。
  swing-duration-ticks: 8
  # 挖掘摆臂续期，松手/方块破坏/换目标/换工具会结束；超时防止残留。
  mining-timeout-ticks: 12

# 仅延迟模型的显示位置和对应姿态，真实玩家坐标/碰撞照常。
# 0 = 紧跟；2 = 约 100 ms 拖后；建议 1–4。不会复制多个模型残影。
visual-follow:
  delay-ticks: 2
  max-distance-blocks: 2.0
  # 进入/离开坐姿、趴姿、睡眠、游泳、载具和飞行立即对齐。
  snap-on-posture-change: true

jump:
  # 0 = 按当前跳跃动画长度、速度及入场时间计算。防止一落地就切掉动画。
  minimum-play-ticks: 0
  # 落地后最多保留这么多 tick；遇其他姿态、传送、重置立即结束。
  landing-grace-ticks: 6

# 以下仅控制本插件的动画层。关闭坐姿同步不妨碍 GSit 真实坐下。
# ME 自身的基础自动动作仍由 ME 管理。
synchronization:
  enabled: true
  movement: true
  sprint: true
  jump: true
  sit: true
  sleep: true
  ride: true
  crawl: true
  sneak: true
  swim: true
  flight: true
  elytra: true
  swing: true
  mining: true

manual:
  allow-raw-animation: true
  cooldown-ticks: 4
  max-duration-ticks: 600
  min-speed: 0.1
  max-speed: 5.0
  interrupt-on-movement: true
  interrupt-on-damage: true
  interrupt-on-posture: true

gameplay:
  # 真实生存飞行须同时开启此项并授予 mact.flight；创造飞行的动作照常同步。
  allow-flight-command: false
  flight-speed: 0.1

animations:
  defaults:
    idle: [idle]
    walk: [walk]
    run: [run, walk]
    jump: [jump, player_jump]
    fall: [fall, jump]
    sit: [sit]
    # GSit 躺下接触地面；原生床使用独立状态及床顶锚点/朝向。
    sleep: [bed_sleep, sleep, lay]
    bed-sleep: [bed_sleep, sleep, lay]
    boat: [boat, sit]
    minecart: [minecart, sit]
    ride: [ride, sit]
    ride-pig: [ride_pig, ride, sit]
    ladder-move: [ladder_up]
    ladder-idle: [ladder_stillness]
    crawl-idle: [climbing, crawl_idle]
    crawl-walk: [climb, crawl_walk]
    crouch-idle: [sneaking, crouch_idle]
    crouch-walk: [sneak, crouch_walk]
    swim-idle: [swim_stand, swim_idle, swim]
    # 漂浮直立与水平游泳停住是两种姿态；后者不能回退到直立 swim_idle。
    swim-prone-idle: [swim_prone_idle, swim]
    swim-walk: [swim, swim_idle]
    hover: [hover, fly]
    fly: [fly, hover]
    elytra: [elytra_fly, fly]
    # 原生左键摆臂与 /meplayeractions play wave（主动挥手）独立；此层只映射模型已有动画。
    swing-mainhand: [swing_hand, attack, use_mainhand]
    swing-offhand: [attack_offhand, use_offhand]
    mining: [mining, dig, attack, use_mainhand]
  models: {}

# 按状态设置速度、ONCE/LOOP/HOLD、入场和退场混合 tick。
# 未配置状态继承 controller 的过渡时间，速度为 1。
# 坐姿/睡眠/陆地趴姿默认 HOLD；运动和挖掘 LOOP；跳跃、挥臂 ONCE。
animation-settings:
  jump:
    loop: ONCE
    transition-in-ticks: 1
    transition-out-ticks: 2
  fall:
    loop: HOLD
  sleep:
    loop: HOLD
    speed: 1.0
  bed-sleep:
    loop: HOLD
    speed: 1.0
  mining:
    loop: LOOP
    speed: 1.0
    transition-in-ticks: 1
    transition-out-ticks: 1
  swing-mainhand:
    loop: ONCE
    transition-in-ticks: 1
    transition-out-ticks: 1
  swing-offhand:
    loop: ONCE
    transition-in-ticks: 1
    transition-out-ticks: 1

# /meplayeractions play wave。可新增动作名映射到任意已存在的动画。
custom-actions:
  wave:
    enabled: true
    label: 挥手
    animation: wave
    loop: ONCE
    speed: 1.0
    permission: mact.use
  nod:
    label: 点头
    animation: nod
    loop: ONCE
    speed: 1.0
  talk:
    label: 说话
    animation: talk
    loop: ONCE
    speed: 1.0
  smile:
    label: 微笑
    animation: smile
    loop: ONCE
    speed: 1.0
  surprised:
    label: 惊讶
    animation: surprised
    loop: ONCE
    speed: 1.0

# 原始动画的菜单中文名称；旧配置未写时仍使用内置汉化。
# custom-actions.<动作>.label 优先于这里的名称，可为自定义动画增加条目。
# 未提供名称的动作显示原始动画 ID，轮盘和播放提示均不依赖客户端下载模型。
menu:
  animation-labels:
    idle: 站立待机
    walk: 行走
    run: 奔跑
    death: 死亡
    jump: 跳跃
    player_jump: 完整跳跃
    fly: 飞行
    hover: 悬停
    hurt: 受伤
    crouch_idle: 潜行待机
    crouch_walk: 潜行移动
    swim: 游泳
    swim_idle: 踩水待机
    sit: 坐下
    sleep: 卷曲睡眠
    bed_sleep: 横卧睡眠
    climb: 爬行移动
    climbing: 趴下待机
    sneak: 潜行移动
    sneaking: 潜行待机
    boat: 船中坐姿
    minecart: 矿车坐姿
    ride: 骑乘
    ride_pig: 骑猪
    elytra_fly: 鞘翅滑翔
    fall: 下落
    mining: 挖掘
    swing_hand: 主手挥臂
    ladder_up: 向上攀梯
    ladder_stillness: 攀梯停留
    climb_idle: 攀爬待机
    crawl_idle: 趴下待机
    crawl_walk: 爬行移动
    use_mainhand: 使用主手
    use_offhand: 使用副手
    attack: 主手攻击／挥臂
    ribbon_sway: 飘带摆动
    tail_hair_sway: 尾巴与发丝摆动
    blink: 眨眼
    wave: 挥手
    nod: 点头
    talk: 说话
    smile: 微笑
    surprised: 惊讶

client-sync:
  # 客户端协议 v3；0.4.2 默认由服务器向当前可见伪装的观众主动推送完整模型。
  # 客户端只反馈服务器授权的缓存状态，模型/纹理加载成功且服务器确认 ready 后按观众切换本地渲染。
  # 未安装模组、资产失败、断开或 100 tick 无渲染续租时继续/恢复 ME。
  # 原始模型依次读取本插件 models/、插件 JAR 内置示例、ME blueprints/；不修改 ME/CE 资源包流程。
  enabled: true
  max-payload-bytes: 16000
  request-cooldown-ticks: 4
  view-distance-blocks: 64
  private-models:
    # 私人模型多人同步独立协商；旧配置缺此节时也保持关闭。
    # 开启后仍须分别授予发布者 mact.private.upload、观看者 mact.private.view，并由发布者在客户端显式开启同步。
    enabled: false
    # 完整 ZIP 与全部展开资源各最多 8 MiB，不读取或提供任意服务器模型路径。
    max-bundle-bytes: 8388608
    # 内存总预算包含已发布 ZIP、接收中的 ZIP 与验证时预留的展开上限。
    max-stored-bytes: 33554432
    # 仅缓存该玩家实际上传并验证过的完整私人资源；不用于 ME 蓝图，也不自动恢复离线伪装。
    # clear/退出撤销分享，但缓存可供同一玩家以后重新分享；读取、写入与校验均在后台完成。
    cache-enabled: true
    # plugins/MEPlayerActions/private-models/：默认磁盘 128 MiB、512 份、每玩家 4 份，满后淘汰最久未使用资源。
    max-cache-bytes: 134217728
    max-cache-models: 512
    max-cache-models-per-player: 4
    # 必须同时满足同世界、真实实体跟踪、canSee、距离和最近观看者名额。
    view-distance-blocks: 64
    max-viewers: 10
