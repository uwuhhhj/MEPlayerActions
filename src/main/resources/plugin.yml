name: MEPlayerActions
version: '${version}'
main: com.simmc.meplayeractions.MEPlayerActionsPlugin
api-version: '1.21.11'
description: Optional ModelEngine player actions and opt-in private client model sync
authors: [SIMMC, Loliiiico]
softdepend: [ModelEngine, GSit]
commands:
  meplayeractions:
    description: 玩家模型动作
    usage: /meplayeractions help
    permission: mact.use
permissions:
  mact.use:
    default: true
  mact.disguise:
    default: true
  mact.disguise.effects:
    description: 为本次伪装施加缓慢药水效果
    default: op
  mact.play:
    default: true
  mact.sit:
    default: true
  mact.crawl:
    default: true
  mact.sync:
    default: true
  mact.private.upload:
    description: 显式发布本人私人模型与配置给有权限的跟踪观看者
    default: false
  mact.private.view:
    description: 接收并显示获准发布的私人模型
    default: false
  mact.flight:
    default: op
  mact.debug:
    default: op
  mact.admin:
    default: op
