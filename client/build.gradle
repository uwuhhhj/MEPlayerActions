plugins {
    id 'fabric-loom' version '1.13.6'
}

group = 'com.simmc'
version = '0.6.0'
base { archivesName = 'MEPlayerActions-Client' }

repositories {
    mavenCentral()
    maven { url = uri('../build/maven-repo') }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.140.2+1.21.11'
    implementation 'com.github.luben:zstd-jni:1.5.7-6'
    include 'com.github.luben:zstd-jni:1.5.7-6'
    implementation 'org.glavo:webp:0.2.0'
    include 'org.glavo:webp:0.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// One bounded expression implementation is used by client and server.
sourceSets.main.java.srcDir('../src/main/java/com/simmc/meplayeractions/expression')
sourceSets.main.java.srcDir('../src/main/java/com/simmc/meplayeractions/config')
sourceSets.main.java.exclude('Settings.java')
sourceSets.main.java.exclude('PerformanceSettings.java')

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

sourceSets.test.resources {
    srcDir '../examples/models'
    include '*.bbmodel'
}

// Same-named numeric blueprints are separate fixtures from full server runtime exports.
tasks.named('processTestResources') {
    from('../examples/blueprints') {
        include 'ysm_01_jk.bbmodel', 'ysm_02_jk.bbmodel'
        into 'numeric-blueprints'
    }
}

test {
    useJUnitPlatform()
    maxHeapSize = '1G'
    // Windows launchers can decode Gradle's UTF-8 @argfile using the system ACP.
    // Keep non-ASCII runtime entries out of that file, without changing JVM/OS defaults.
    doFirst {
        def isAsciiPath = { File value -> value.path.chars().allMatch { point -> point < 128 } }
        if (System.getProperty('os.name').startsWith('Windows') && classpath.files.any { !isAsciiPath(it) }) {
            File stagingRoot = providers.gradleProperty('mpaAsciiRuntimeDir').map { file(it) }
                    .getOrElse(new File(System.getProperty('java.io.tmpdir'), 'meplayeractions-client-runtime'))
            if (!isAsciiPath(stagingRoot)) throw new GradleException('Set -PmpaAsciiRuntimeDir to an ASCII-only temporary directory')
            stagingRoot.mkdirs()
            File staging = java.nio.file.Files.createTempDirectory(stagingRoot.toPath(), 'test-').toFile()
            Map<File, File> remapped = [:]
            classpath.files.eachWithIndex { original, index ->
                if (!isAsciiPath(original)) {
                    File entry = new File(staging, 'entry-' + index)
                    project.copy { from original; into entry }
                    remapped[original] = original.isDirectory() ? entry : new File(entry, original.name)
                }
            }
            classpath = files(classpath.files.collect { remapped.getOrDefault(it, it) })
            testClassesDirs = files(testClassesDirs.files.collect { remapped.getOrDefault(it, it) })
        }
    }
}

loom {
    runs {
        client {
            runDir = 'run'
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
